
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>Admin NontonKu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    .admin-wrap { max-width: 760px; margin: 24px auto; padding: 16px; }
    .panel { margin-bottom: 20px; }
    .panel input:not([type="file"]) { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px; }
    .file { display:block; margin-top:14px; }
    .file input { display:block; margin-top:8px; max-width:100%; }
    .msg { overflow-wrap:anywhere; }
    .film-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #ddd3; }
    .film-row small { display:block; margin-top:5px; }
    .hidden { display:none !important; }
    button:disabled { opacity:.6; }
  </style>
</head>
<body class="admin-body">
<header class="nav">
  <div class="brand">NONTON<span>KU</span> <small>ADMIN</small></div>
  <a href="index.html" class="admin-link">Situs Web</a>
</header>

<main class="admin-wrap">
  <div id="loginBox" class="panel">
    <h1>Login Admin</h1>
    <p class="muted">Masuk menggunakan akun admin Supabase baru.</p>
    <input id="email" type="email" placeholder="Email admin" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" type="button" onclick="login()">Masuk</button>
    <p id="loginMsg" class="msg" role="status"></p>
  </div>

  <div id="dash" class="hidden">
    <div class="panel">
      <div class="row">
        <h1>Unggah Film</h1>
        <button class="secondary" type="button" onclick="logout()">Keluar</button>
      </div>

      <input id="title" placeholder="Judul film" maxlength="250">
      <div class="two">
        <input id="year" type="number" placeholder="Tahun" min="1888" max="2100">
        <input id="genre" placeholder="Genre">
      </div>

      <label class="file">Pilih poster (opsional, maksimal 5 MB)
        <input id="posterFile" type="file" accept="image/*" onchange="showPoster()">
      </label>
      <p id="posterInfo" class="muted"></p>

      <label class="file">Pilih video
        <input id="videoFile" type="file" accept="video/*" onchange="showFile()">
      </label>
      <p id="fileInfo" class="muted"></p>

      <button id="uploadBtn" type="button" onclick="uploadFilm()">Unggah &amp; Publikasikan</button>
      <p id="status" class="msg" role="status"></p>
    </div>

    <div class="panel">
      <h2>Film Terupload</h2>
      <button type="button" class="secondary" onclick="loadFilms()">Muat ulang daftar</button>
      <div id="list"></div>
    </div>
  </div>
</main>

<script>
"use strict";

let db;
let session;
let uploading = false;

const $ = id => document.getElementById(id);

function message(id, text) {
  $(id).textContent = text;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function init() {
  const config = window.NONTONKU_CONFIG;

  if (!window.supabase || !config?.SUPABASE_URL ||
      !config?.SUPABASE_PUBLISHABLE_KEY) {
    message("loginMsg", "Konfigurasi Supabase belum lengkap. Periksa config.js.");
    return;
  }

  db = window.supabase.createClient(
    config.SUPABASE_URL,
    config.SUPABASE_PUBLISHABLE_KEY
  );

  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    session = data.session;
    updateUI();

    db.auth.onAuthStateChange((_event, newSession) => {
      session = newSession;
      updateUI();
    });
  } catch (error) {
    message("loginMsg", "Gagal memeriksa sesi: " + error.message);
  }
}

function updateUI() {
  $("loginBox").classList.toggle("hidden", !!session);
  $("dash").classList.toggle("hidden", !session);

  if (session) loadFilms();
}

async function login() {
  if (!db) {
    message("loginMsg", "Supabase belum siap. Periksa config.js.");
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("loginMsg", "Email dan password wajib diisi.");
    return;
  }

  $("loginBtn").disabled = true;
  message("loginMsg", "Memeriksa login...");

  try {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    message("loginMsg", "Login berhasil.");
  } catch (error) {
    message("loginMsg", "Login gagal: " + error.message);
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function logout() {
  if (!db) return;
  const { error } = await db.auth.signOut();

  if (error) {
    message("status", "Gagal keluar: " + error.message);
  } else {
    message("loginMsg", "Kamu sudah keluar.");
  }
}

function showFile() {
  const file = $("videoFile").files[0];
  message("fileInfo", file
    ? `${file.name} — ${(file.size / 1048576).toFixed(1)} MB`
    : "");
}

function showPoster() {
  const file = $("posterFile").files[0];
  message("posterInfo", file
    ? `${file.name} — ${(file.size / 1048576).toFixed(1)} MB`
    : "");
}

async function uploadFilm() {
  if (uploading) return;

  if (!session?.access_token) {
    message("status", "Sesi login berakhir. Silakan login kembali.");
    return;
  }

  const title = $("title").value.trim();
  const year = $("year").value.trim();
  const genre = $("genre").value.trim();
  const videoFile = $("videoFile").files[0];
  const posterFile = $("posterFile").files[0];

  if (!title || !videoFile) {
    message("status", "Judul dan video wajib diisi.");
    return;
  }

  if (!videoFile.type.startsWith("video/")) {
    message("status", "Pilih file video yang valid.");
    return;
  }

  if (posterFile && !posterFile.type.startsWith("image/")) {
    message("status", "Poster harus berupa gambar.");
    return;
  }

  if (posterFile && posterFile.size > 5 * 1024 * 1024) {
    message("status", "Poster maksimal 5 MB.");
    return;
  }

  uploading = true;
  $("uploadBtn").disabled = true;

  let videoPath = "";
  let posterPath = "";

  try {
    const safeName = videoFile.name
      .replace(/[^a-zA-Z0-9._-]/g, "_");
    videoPath = `${crypto.randomUUID()}-${safeName}`;

    message("status", "Mengunggah video ke Supabase...");

    const videoResult = await db.storage.from("videos").upload(
      videoPath,
      videoFile,
      { contentType: videoFile.type, upsert: false }
    );

    if (videoResult.error) throw new Error(
      "Video gagal diunggah: " + videoResult.error.message
    );

    const videoUrl = db.storage.from("videos")
      .getPublicUrl(videoPath).data.publicUrl;

    let posterUrl = "";

    if (posterFile) {
      message("status", "Mengunggah poster...");

      const extension = posterFile.name.includes(".")
        ? posterFile.name.split(".").pop().replace(/[^a-zA-Z0-9]/g, "")
        : "jpg";

      posterPath = `${crypto.randomUUID()}.${extension || "jpg"}`;

      const posterResult = await db.storage.from("posters").upload(
        posterPath,
        posterFile,
        { contentType: posterFile.type, upsert: false }
      );

      if (posterResult.error) throw new Error(
        "Poster gagal diunggah: " + posterResult.error.message
      );

      posterUrl = db.storage.from("posters")
        .getPublicUrl(posterPath).data.publicUrl;
    }

    message("status", "Menyimpan data film...");

    const result = await db.from("films").insert({
      title: title,
      year: year || null,
      release_year: year || null,
      genre: genre || null,
      poster_url: posterUrl || null,
      poster_path: posterPath || null,
      video_url: videoUrl,
      video_path: videoPath,
      storage_path: videoPath,
      published: true
    });

    if (result.error) {
      throw new Error(
        "Data film gagal disimpan: " + result.error.message +
        ". File video mungkin sudah terunggah ke Storage."
      );
    }

    message("status", "Berhasil! Film sudah dipublikasikan.");

    $("title").value = "";
    $("year").value = "";
    $("genre").value = "";
    $("posterFile").value = "";
    $("videoFile").value = "";

    showPoster();
    showFile();
    await loadFilms();

  } catch (error) {
    message("status", error.message || "Terjadi kesalahan saat mengunggah.");
  } finally {
    uploading = false;
    $("uploadBtn").disabled = false;
  }
}

async function loadFilms() {
  if (!db || !session) return;

  const list = $("list");
  list.textContent = "Memuat daftar film...";

  try {
    const result = await db.from("films")
      .select("id,title,year,release_year,genre,created_at")
      .order("created_at", { ascending: false });

    if (result.error) throw result.error;

    const films = result.data || [];

    if (!films.length) {
      list.innerHTML = '<p class="muted">Belum ada film.</p>';
      return;
    }

    list.innerHTML = films.map(film => `
      <div class="film-row">
        <div>
          <b>${esc(film.title)}</b>
          <small>${esc(film.year || film.release_year || "")} • ${esc(film.genre || "")}</small>
        </div>
        <button class="danger" type="button"
          onclick="delFilm('${esc(film.id)}')">Hapus</button>
      </div>
    `).join("");
  } catch (error) {
    list.textContent = "Gagal memuat film: " + error.message;
  }
}

async function delFilm(id) {
  if (!session) {
    message("status", "Silakan login kembali.");
    return;
  }

  if (!confirm("Hapus data film dari NontonKu? File di Storage tidak ikut terhapus.")) {
    return;
  }

  try {
    const result = await db.from("films").delete().eq("id", id);
    if (result.error) throw result.error;

    message("status", "Data film dihapus. File video masih ada di Storage.");
    await loadFilms();
  } catch (error) {
    message("status", "Gagal menghapus film: " + error.message);
  }
}

init();
</script>
</body>
</html>
