<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin NontonKu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body class="admin-body">
  <header class="nav">
    <div class="brand">NONTON<span>KU</span> <small>ADMIN</small></div>
    <a href="index.html" class="admin-link">Situs Web</a>
  </header>

  <main class="admin-wrap">
    <div id="loginBox" class="panel">
      <h1>Login Admin</h1>
      <p class="muted">Masuk menggunakan akun admin Supabase.</p>
      <input id="email" type="email" placeholder="Email admin" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" onclick="login()">Masuk</button>
      <p id="loginMsg" class="msg"></p>
    </div>

    <div id="dash" class="hidden">
      <div class="panel">
        <div class="row">
          <h1>Unggah Film</h1>
          <button class="secondary" onclick="logout()">Keluar</button>
        </div>

        <input id="title" placeholder="Judul film">
        <div class="two">
          <input id="year" placeholder="Tahun">
          <input id="genre" placeholder="Genre">
        </div>

        <label class="file">
          Pilih poster (opsional)
          <input id="posterFile" type="file" accept="image/*" onchange="showPoster()">
        </label>
        <p id="posterInfo" class="muted"></p>

        <label class="file">
          Pilih video
          <input id="videoFile" type="file" accept="video/*" onchange="showFile()">
        </label>
        <p id="fileInfo" class="muted"></p>

        <button id="uploadBtn" onclick="uploadFilm()">Unggah &amp; Publikasikan</button>
        <p id="status" class="msg"></p>
      </div>

      <div class="panel">
        <h2>Film Terupload</h2>
        <div id="list"></div>
      </div>
    </div>
  </main>

<script>
"use strict";

let db;
let session;
let uploading = false;

const el = (id) => document.getElementById(id);

function showMessage(id, message) {
  el(id).textContent = message;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function init() {
  if (
    !window.NONTONKU_CONFIG ||
    !NONTONKU_CONFIG.SUPABASE_URL ||
    !NONTONKU_CONFIG.SUPABASE_PUBLISHABLE_KEY
  ) {
    showMessage(
      "loginMsg",
      "Konfigurasi Supabase belum lengkap. Periksa config.js."
    );
    return;
  }

  db = window.supabase.createClient(
    NONTONKU_CONFIG.SUPABASE_URL,
    NONTONKU_CONFIG.SUPABASE_PUBLISHABLE_KEY
  );

  const result = await db.auth.getSession();

  if (result.error) {
    showMessage("loginMsg", "Gagal memeriksa sesi login. Silakan muat ulang.");
    return;
  }

  session = result.data.session;
  updateUI();

  db.auth.onAuthStateChange((_event, newSession) => {
    session = newSession;
    updateUI();
  });
}

function updateUI() {
  el("loginBox").classList.toggle("hidden", !!session);
  el("dash").classList.toggle("hidden", !session);

  if (session && db) {
    loadFilms();
  }
}

async function login() {
  if (!db) {
    showMessage("loginMsg", "Supabase belum siap. Muat ulang halaman.");
    return;
  }

  const email = el("email").value.trim();
  const password = el("password").value;

  if (!email || !password) {
    showMessage("loginMsg", "Email dan password wajib diisi.");
    return;
  }

  el("loginBtn").disabled = true;
  showMessage("loginMsg", "Memeriksa login...");

  try {
    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    showMessage("loginMsg", error ? error.message : "");
  } catch (error) {
    showMessage("loginMsg", "Login gagal. Periksa koneksi dan konfigurasi.");
  } finally {
    el("loginBtn").disabled = false;
  }
}

async function logout() {
  if (!db) return;

  const { error } = await db.auth.signOut();

  if (error) {
    showMessage("status", "Gagal keluar: " + error.message);
  }
}

function showFile() {
  const file = el("videoFile").files[0];

  showMessage(
    "fileInfo",
    file
      ? `${file.name} — ${(file.size / 1024 / 1024).toFixed(1)} MB`
      : ""
  );
}

function showPoster() {
  const file = el("posterFile").files[0];

  showMessage(
    "posterInfo",
    file
      ? `${file.name} — ${(file.size / 1024 / 1024).toFixed(1)} MB`
      : ""
  );
}

async function uploadFilm() {
  if (uploading) return;

  if (!session || !session.access_token) {
    showMessage("status", "Sesi login berakhir. Silakan login kembali.");
    return;
  }

  const title = el("title").value.trim();
  const year = el("year").value.trim();
  const genre = el("genre").value.trim();
  const videoFile = el("videoFile").files[0];
  const posterFile = el("posterFile").files[0];

  if (!title || !videoFile) {
    showMessage("status", "Judul dan video wajib diisi.");
    return;
  }

  if (!videoFile.type.startsWith("video/")) {
    showMessage("status", "Pilih file video yang valid.");
    return;
  }

  if (posterFile && !posterFile.type.startsWith("image/")) {
    showMessage("status", "Pilih file gambar untuk poster.");
    return;
  }

  if (posterFile && posterFile.size > 5 * 1024 * 1024) {
    showMessage("status", "Poster maksimal 5 MB.");
    return;
  }

  uploading = true;
  el("uploadBtn").disabled = true;

  let posterPath = "";
  let posterUrl = "";

  try {
    showMessage("status", "Meminta tautan unggah Cloudflare Stream...");

    const token = session.access_token;

    const linkResponse = await fetch("/api/stream-upload", {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    const linkData = await linkResponse.json().catch(() => ({}));

    if (!linkResponse.ok || !linkData.uploadURL || !linkData.uid) {
      throw new Error(
        linkData.error || "Gagal mendapatkan tautan unggah Cloudflare."
      );
    }

    showMessage(
      "status",
      "Mengunggah video ke Cloudflare Stream. Jangan tutup halaman..."
    );

    const formData = new FormData();
    formData.append("file", videoFile);

    const uploadResponse = await fetch(linkData.uploadURL, {
      method: "POST",
      body: formData
    });

    if (!uploadResponse.ok) {
      throw new Error(
        "Unggahan video ke Cloudflare gagal. Coba lagi atau periksa konfigurasi Stream."
      );
    }

    const uid = linkData.uid;

    /*
     * URL HLS untuk pemutaran video.
     * Kompatibilitasnya tetap perlu diuji dengan pemutar di index.html.
     */
    const videoUrl =
      `https://videodelivery.net/${encodeURIComponent(uid)}/manifest/video.m3u8`;

    if (posterFile) {
      showMessage("status", "Video terunggah. Mengunggah poster...");

      const extension = posterFile.name.includes(".")
        ? posterFile.name.split(".").pop().replace(/[^a-zA-Z0-9]/g, "")
        : "jpg";

      posterPath = `${crypto.randomUUID()}.${extension || "jpg"}`;

      const posterResult = await db.storage
        .from("posters")
        .upload(posterPath, posterFile, {
          contentType: posterFile.type,
          upsert: false
        });

      if (posterResult.error) {
        throw new Error(
          "Video sudah diunggah, tetapi poster gagal diunggah: " +
          posterResult.error.message
        );
      }

      posterUrl = db.storage
        .from("posters")
        .getPublicUrl(posterPath).data.publicUrl;
    }

    showMessage("status", "Menyimpan informasi film...");

    const insertResult = await db.from("films").insert({
      title,
      year: year || null,
      genre: genre || null,
      poster_url: posterUrl,
      video_url: videoUrl,
      storage_path: uid
    });

    if (insertResult.error) {
      throw new Error(
        "Video sudah masuk Cloudflare, tetapi data film gagal disimpan: " +
        insertResult.error.message +
        ". ID Cloudflare: " + uid
      );
    }

    showMessage(
      "status",
      "Film berhasil dipublikasikan! Video sedang diproses Cloudflare."
    );

    el("title").value = "";
    el("year").value = "";
    el("genre").value = "";
    el("posterFile").value = "";
    el("videoFile").value = "";

    showPoster();
    showFile();

    await loadFilms();
  } catch (error) {
    showMessage(
      "status",
      error.message || "Terjadi kesalahan saat mengunggah film."
    );
  } finally {
    uploading = false;
    el("uploadBtn").disabled = false;
  }
}

async function loadFilms() {
  if (!db || !session) return;

  const list = el("list");
  list.textContent = "Memuat daftar film...";

  const result = await db
    .from("films")
    .select("*")
    .order("created_at", { ascending: false });

  if (result.error) {
    list.textContent = "Gagal memuat film: " + result.error.message;
    return;
  }

  const films = result.data || [];

  if (!films.length) {
    list.innerHTML = '<p class="muted">Belum ada film.</p>';
    return;
  }

  list.innerHTML = films.map((film) => `
    <div class="film-row">
      <div>
        <b>${escapeHTML(film.title)}</b>
        <small>
          ${escapeHTML(film.year || "")}
          •
          ${escapeHTML(film.genre || "")}
        </small>
      </div>
      <button
        class="danger"
        onclick="delFilm('${escapeHTML(film.id)}')"
      >Hapus</button>
    </div>
  `).join("");
}

async function delFilm(id) {
  if (!session) {
    showMessage("status", "Silakan login kembali.");
    return;
  }

  const confirmed = confirm(
    "Hapus data film ini dari daftar NontonKu? Video di Cloudflare Stream tidak ikut terhapus."
  );

  if (!confirmed) return;

  const result = await db.from("films").delete().eq("id", id);

  if (result.error) {
    showMessage("status", "Gagal menghapus film: " + result.error.message);
    return;
  }

  showMessage(
    "status",
    "Data film dihapus. File video di Cloudflare masih tersimpan."
  );

  await loadFilms();
}

init();
</script>
</body>
</html>
