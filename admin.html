<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin NontonKu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="admin-body">
<header class="nav">
  <div class="brand">NONTON<span>KU</span> <small>ADMIN</small></div>
  <a href="index.html" class="admin-link">Situs Web</a>
</header>

<main class="admin-wrap">
  <div id="loginBox" class="panel">
    <h1>Login Admin</h1>
    <p class="muted">Masuk menggunakan akun admin Supabase.</p>
    <input id="email" type="email" placeholder="Email admin">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Masuk</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="dash" class="hidden">
    <div class="panel">
      <div class="row">
        <h1>Unggah Film</h1>
        <button class="secondary" onclick="logout()">Keluar</button>
      </div>

      <input id="title" placeholder="Judul film">
      <div class="two">
        <input id="year" placeholder="Tahun">
        <input id="genre" placeholder="Genre">
      </div>

      <label class="file">Pilih poster (opsional)
        <input id="posterFile" type="file" accept="image/*" onchange="showPoster()">
      </label>
      <p id="posterInfo" class="muted"></p>

      <label class="file">Pilih video
        <input id="videoFile" type="file" accept="video/*" onchange="showFile()">
      </label>
      <p id="fileInfo" class="muted"></p>

      <button id="uploadBtn" onclick="uploadFilm()">Unggah &amp; Publikasikan</button>
      <p id="status" class="msg"></p>
    </div>

    <div class="panel">
      <h2>Film Terupload</h2>
      <div id="list"></div>
    </div>
  </div>
</main>

<script>
"use strict";

let db;
let session;
let uploading = false;

const $ = id => document.getElementById(id);

function message(id, text) {
  $(id).textContent = text;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function init() {
  if (
    !window.NONTONKU_CONFIG ||
    !NONTONKU_CONFIG.SUPABASE_URL ||
    !NONTONKU_CONFIG.SUPABASE_PUBLISHABLE_KEY
  ) {
    message("loginMsg", "Konfigurasi Supabase belum lengkap. Periksa config.js.");
    return;
  }

  db = window.supabase.createClient(
    NONTONKU_CONFIG.SUPABASE_URL,
    NONTONKU_CONFIG.SUPABASE_PUBLISHABLE_KEY
  );

  try {
    const result = await db.auth.getSession();

    if (result.error) throw result.error;

    session = result.data.session;
    updateUI();

    db.auth.onAuthStateChange((_event, newSession) => {
      session = newSession;
      updateUI();
    });
  } catch (error) {
    message("loginMsg", "Gagal memeriksa sesi login. Muat ulang halaman.");
  }
}

function updateUI() {
  $("loginBox").classList.toggle("hidden", !!session);
  $("dash").classList.toggle("hidden", !session);

  if (session) loadFilms();
}

async function login() {
  if (!db) {
    message("loginMsg", "Supabase belum siap. Muat ulang halaman.");
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("loginMsg", "Email dan password wajib diisi.");
    return;
  }

  $("loginBtn").disabled = true;
  message("loginMsg", "Memeriksa login...");

  try {
    const { error } = await db.auth.signInWithPassword({ email, password });
    message("loginMsg", error ? error.message : "");
  } catch (error) {
    message("loginMsg", "Login gagal. Periksa koneksi internet.");
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function logout() {
  if (!db) return;

  const { error } = await db.auth.signOut();

  if (error) message("status", "Gagal keluar: " + error.message);
}

function showFile() {
  const file = $("videoFile").files[0];

  message(
    "fileInfo",
    file ? `${file.name} — ${(file.size / 1048576).toFixed(1)} MB` : ""
  );
}

function showPoster() {
  const file = $("posterFile").files[0];

  message(
    "posterInfo",
    file ? `${file.name} — ${(file.size / 1048576).toFixed(1)} MB` : ""
  );
}

async function uploadFilm() {
  if (uploading) return;

  if (!session?.access_token) {
    message("status", "Sesi login berakhir. Silakan login kembali.");
    return;
  }

  const title = $("title").value.trim();
  const year = $("year").value.trim();
  const genre = $("genre").value.trim();
  const videoFile = $("videoFile").files[0];
  const posterFile = $("posterFile").files[0];

  if (!title || !videoFile) {
    message("status", "Judul dan video wajib diisi.");
    return;
  }

  if (!videoFile.type.startsWith("video/")) {
    message("status", "Pilih file video yang valid.");
    return;
  }

  if (posterFile && !posterFile.type.startsWith("image/")) {
    message("status", "File poster harus berupa gambar.");
    return;
  }

  if (posterFile && posterFile.size > 5 * 1024 * 1024) {
    message("status", "Poster maksimal 5 MB.");
    return;
  }

  uploading = true;
  $("uploadBtn").disabled = true;

  let posterPath = "";
  let posterUrl = "";
  let cloudflareUid = "";

  try {
    message("status", "Meminta tautan unggah Cloudflare...");

    const linkResponse = await fetch("/api/stream-upload", {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`
      }
    });

    const linkData = await linkResponse.json().catch(() => ({}));

    if (!linkResponse.ok || !linkData.uploadURL || !linkData.uid) {
      throw new Error(
        linkData.error || "Cloudflare gagal membuat tautan unggah."
      );
    }

    cloudflareUid = linkData.uid;

    message("status", "Mengunggah video ke Cloudflare Stream...");

    const formData = new FormData();
    formData.append("file", videoFile);

    const uploadResponse = await fetch(linkData.uploadURL, {
      method: "POST",
      body: formData
    });

    if (!uploadResponse.ok) {
      throw new Error(
        "Upload Cloudflare gagal. Periksa konfigurasi Stream atau coba lagi."
      );
    }

    // URL iframe untuk pemutar Cloudflare pada index.html.
    const videoUrl =
      `https://iframe.videodelivery.net/${encodeURIComponent(cloudflareUid)}`;

    if (posterFile) {
      message("status", "Video terunggah. Mengunggah poster...");

      const extension = posterFile.name.includes(".")
        ? posterFile.name.split(".").pop().replace(/[^a-zA-Z0-9]/g, "")
        : "jpg";

      posterPath = `${crypto.randomUUID()}.${extension || "jpg"}`;

      const posterResult = await db.storage
        .from("posters")
        .upload(posterPath, posterFile, {
          contentType: posterFile.type,
          upsert: false
        });

      if (posterResult.error) {
        throw new Error(
          "Video sudah diunggah, tetapi poster gagal: " +
          posterResult.error.message +
          ". ID Cloudflare: " + cloudflareUid
        );
      }

      posterUrl = db.storage
        .from("posters")
        .getPublicUrl(posterPath).data.publicUrl;
    }

    message("status", "Menyimpan data film...");

    const result = await db.from("films").insert({
      title,
      year: year || null,
      genre: genre || null,
      poster_url: posterUrl,
      video_url: videoUrl,
      storage_path: cloudflareUid
    });

    if (result.error) {
      throw new Error(
        "Video sudah diunggah ke Cloudflare, tetapi data film gagal disimpan: " +
        result.error.message +
        ". ID Cloudflare: " + cloudflareUid
      );
    }

    message(
      "status",
      "Film berhasil dipublikasikan. Cloudflare mungkin masih memproses video."
    );

    $("title").value = "";
    $("year").value = "";
    $("genre").value = "";
    $("posterFile").value = "";
    $("videoFile").value = "";

    showPoster();
    showFile();

    await loadFilms();
  } catch (error) {
    message("status", error.message || "Terjadi kesalahan saat mengunggah film.");
  } finally {
    uploading = false;
    $("uploadBtn").disabled = false;
  }
}

async function loadFilms() {
  if (!db || !session) return;

  const list = $("list");
  list.textContent = "Memuat daftar film...";

  const result = await db
    .from("films")
    .select("*")
    .order("created_at", { ascending: false });

  if (result.error) {
    list.textContent = "Gagal memuat film: " + result.error.message;
    return;
  }

  const films = result.data || [];

  if (!films.length) {
    list.innerHTML = '<p class="muted">Belum ada film.</p>';
    return;
  }

  list.innerHTML = films.map(film => `
    <div class="film-row">
      <div>
        <b>${esc(film.title)}</b>
        <small>${esc(film.year || "")} • ${esc(film.genre || "")}</small>
      </div>
      <button class="danger" onclick="delFilm('${esc(film.id)}')">Hapus</button>
    </div>
  `).join("");
}

async function delFilm(id) {
  if (!session) {
    message("status", "Silakan login kembali.");
    return;
  }

  if (!confirm(
    "Hapus data film dari NontonKu? Video di Cloudflare Stream tidak ikut terhapus."
  )) return;

  const result = await db.from("films").delete().eq("id", id);

  if (result.error) {
    message("status", "Gagal menghapus film: " + result.error.message);
    return;
  }

  message("status", "Data film dihapus. Video Cloudflare masih tersimpan.");
  await loadFilms();
}

init();
</script>
</body>
</html>
